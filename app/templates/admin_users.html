<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage admin logins</title>
  <link rel="stylesheet" href="/static/app.css?v=20261125-2">
</head>
<body>
  {% include "admin_nav.html" %}
  <main class="page">
    <p class="eyebrow">Super Admin</p><h1>Manage Admin Login</h1>
    <section class="panel">
      <form id="admin-user-form" class="form-grid">
        <label>Username<input name="username" required maxlength="100"></label>
        <label>Initial password<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label>
        <label>Role<select name="admin_role"><option value="hr">HR</option><option value="accounts">Accounts</option><option value="team_lead">Team Lead</option><option value="audit">Audit</option><option value="standard">Standard Admin</option></select></label>
        <button type="submit">Create admin login</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
    <section class="panel panel-wide"><div class="table-wrap"><table>
      <thead><tr><th>Username</th><th>Role</th><th>Active</th><th>Action</th></tr></thead>
      <tbody id="admin-user-rows"><tr><td colspan="4">Loading…</td></tr></tbody>
    </table></div></section>
  </main>
  <script src="/static/admin_users.js" defer></script><script src="/static/auth.js" defer></script>
</body>
</html>
