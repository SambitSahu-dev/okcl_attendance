<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit admin profile</title>
  <link rel="stylesheet" href="/static/app.css?v=20261125-2">
</head>
<body>
  {% include "admin_nav.html" %}
  <main class="page">
    <div class="page-heading">
      <div><p class="eyebrow">Admin account</p><h1>Edit profile</h1></div>
    </div>
    <section class="panel panel-narrow">
      <form id="admin-profile-form" class="form-grid">
        <label>Username<input name="username" value="{{ user.username }}" required maxlength="100" autocomplete="username"></label>
        <label>Display name<input name="display_name" value="{{ user.display_name or '' }}" maxlength="200" autocomplete="name"></label>
        <label>Email<input name="email" type="email" value="{{ user.email or '' }}" maxlength="320" autocomplete="email"></label>
        <label>Admin role<input value="{{ (user.admin_role or 'standard')|replace('_', ' ')|title }}" readonly></label>
        <label>Current password<input name="current_password" type="password" required maxlength="128" autocomplete="current-password"></label>
        <label>New password <span class="muted">(optional, at least 12 characters)</span><input name="new_password" type="password" minlength="12" maxlength="128" autocomplete="new-password"></label>
        <label>Confirm new password<input name="confirm_new_password" type="password" minlength="12" maxlength="128" autocomplete="new-password"></label>
        <button type="submit">Save profile</button>
      </form>
      <p id="profile-status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="/static/admin_profile.js" defer></script>
  <script src="/static/auth.js" defer></script>
</body>
</html>
