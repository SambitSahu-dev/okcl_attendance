<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holiday management</title>
  <link rel="stylesheet" href="/static/app.css?v=20261125-2">
</head>
<body>
  {% include "admin_nav.html" %}
  <main class="page">
    <p class="eyebrow">Admin / HR</p><h1>Holiday management</h1>
    <section class="panel">
      <form id="holiday-form" class="form-grid">
        <label>Date<input name="date" type="date" required></label>
        <label>Name<input name="name" maxlength="200" required></label>
        <button type="submit">Add holiday</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
    <section class="panel panel-wide"><div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Holiday</th><th></th></tr></thead>
      <tbody id="holiday-rows"><tr><td colspan="3">Loading…</td></tr></tbody>
    </table></div></section>
  </main>
  <script src="/static/holidays.js" defer></script><script src="/static/auth.js" defer></script>
</body>
</html>
