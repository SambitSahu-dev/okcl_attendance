<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance reports</title>
  <link rel="stylesheet" href="/static/app.css?v=20261125-2">
</head>
<body>
  {% include "admin_nav.html" %}
  <main class="page">
    <p class="eyebrow">Monthly report</p><h1>Excel attendance report</h1>
    <section class="panel">
      <form id="report-form" class="form-grid">
        <label>Year<input name="year" type="number" min="1900" max="9999" value="{{ year }}" required></label>
        <label>Month<input name="month" type="number" min="1" max="12" value="{{ month }}" required></label>
        <button type="submit">Download Excel</button>
      </form>
      <p id="report-info" class="muted">The report includes working-day absences, holidays, weekly offs, login/logout times, working hours, and an “Edited Manually” flag.</p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="/static/reports.js" defer></script><script src="/static/auth.js" defer></script>
</body>
</html>
